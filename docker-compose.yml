version: '3.8'

services:
  # Next.js Application Standalone Container
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lamazad_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lamazad_admin}:${POSTGRES_PASSWORD:-batumi_secret_pass_2026}@db:5432/${POSTGRES_DB:-lamazad_db}?schema=public
      - NEXT_PUBLIC_SITE_URL=https://lamazad.ge
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lamazad_net
    expose:
      - '3000'

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: lamazad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lamazad_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batumi_secret_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lamazad_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lamazad_admin} -d ${POSTGRES_DB:-lamazad_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lamazad_net

  # Nginx Reverse Proxy with SSL Termination
  nginx:
    image: nginx:alpine
    container_name: lamazad_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - lamazad_net

  # Automated SSL with Certbot
  certbot:
    image: certbot/certbot
    container_name: lamazad_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
      - lamazad_net

volumes:
  postgres_data:
    driver: local

networks:
  lamazad_net:
    driver: bridge
